{% extends "base.html" %}
{% block content %}

<h1>✏️ Editar Produto</h1>

<br>

<div class="card">

<form method="POST">

    <label>Nome do Produto</label>
    <input type="text" name="nome" value="{{ p[1] }}" required>

    <br><br>

    <label>Categoria</label>
    <input type="text" name="categoria" value="{{ p[2] }}">

    <br><br>

    <label>Código</label>
    <input type="text" name="codigo" value="{{ p[3] }}">

    <br><br>

    <label>Quantidade</label>
    <input type="number" step="0.01" name="quantidade" value="{{ p[4] }}">

    <br><br>

    <label>Unidade</label>
    <input type="text" name="unidade" value="{{ p[5] }}">

    <br><br>

    <label>Preço de Compra</label>
    <input type="number"
           step="0.01"
           name="preco_compra"
           value="{{ p[6] }}">

    <br><br>

    <button class="btn">
        💾 Salvar Alterações
    </button>

    <a href="/produtos" class="btn red">
        Cancelar
    </a>

</form>

</div>

{% endblock %}
