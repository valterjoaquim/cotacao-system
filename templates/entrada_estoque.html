{% extends "base.html" %}
{% block content %}

<h1>➕ Entrada de Estoque</h1>

<br>

<div class="card">

    <h3>{{ produto[1] }}</h3>

    <p>
        <strong>Código:</strong> {{ produto[3] }} <br>
        <strong>Quantidade atual:</strong> {{ produto[4] }} {{ produto[5] }}
    </p>

    <form method="POST">

        <label>Quantidade a adicionar</label>
        <input type="number" step="0.01" name="quantidade" required>

        <br><br>

        <label>Responsável pela entrada</label>
        <input type="text" name="responsavel" value="{{ session['user'] }}">

        <br><br>

        <label>Observação</label>
        <textarea name="observacao"></textarea>

        <br><br>

        <button class="btn">
            💾 Confirmar Entrada
        </button>

        <a href="/produtos" class="btn red">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
