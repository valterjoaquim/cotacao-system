{% extends "base.html" %}
{% block content %}

<style>
    .page-header {
        background: linear-gradient(135deg, #0d47a1, #1565c0);
        color: white;
        padding: 28px;
        border-radius: 16px;
        margin-bottom: 25px;
    }

    .form-card {
        background: white;
        padding: 28px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .section-title {
        color: #0d47a1;
        border-left: 5px solid #d32f2f;
        padding-left: 12px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fafafa;
    }

    .actions {
        margin-top: 25px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    @media(max-width:800px){
        .form-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="page-header">
    <h1>✏️ Editar Cadastro</h1>
    <p>Atualize os dados do funcionário ou estagiário.</p>
</div>

<div class="form-card">

<form method="POST">

    <h3 class="section-title">👤 Dados Pessoais</h3>

    <div class="form-grid">

        <div class="form-group">
            <label>Tipo</label>
            <select name="tipo" id="tipo" onchange="controlarSalario()" required>
                <option value="Funcionário" {% if f[6] == "Funcionário" %}selected{% endif %}>Funcionário</option>
                <option value="Estagiário" {% if f[6] == "Estagiário" %}selected{% endif %}>Estagiário</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nome</label>
            <input type="text" name="nome" value="{{ f[1] }}" required>
        </div>

        <div class="form-group">
            <label>Cargo / Função</label>
            <input type="text" name="cargo" value="{{ f[2] or '' }}">
        </div>

        <div class="form-group">
            <label>Telefone</label>
            <input type="text" name="telefone" value="{{ f[4] or '' }}">
        </div>

        <div class="form-group">
            <label>BI</label>
            <input type="text" name="bi" value="{{ f[7] or '' }}">
        </div>

        <div class="form-group">
            <label>NUIT</label>
            <input type="text" name="nuit" value="{{ f[8] or '' }}">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ f[9] or '' }}">
        </div>

        <div class="form-group">
            <label>Endereço</label>
            <input type="text" name="endereco" value="{{ f[10] or '' }}">
        </div>

        <div class="form-group" id="campo_salario">
            <label>Salário por Hora</label>
            <input type="number" name="salario_hora" step="0.01" value="{{ f[3] or 0 }}">
        </div>

        <div class="form-group">
            <label>Estado</label>
            <select name="estado">
                <option value="Ativo" {% if f[5] == "Ativo" %}selected{% endif %}>Ativo</option>
                <option value="Inativo" {% if f[5] == "Inativo" %}selected{% endif %}>Inativo</option>
            </select>
        </div>

    </div>

    <div class="actions">
        <button class="btn">
            💾 Salvar Alterações
        </button>

        <a href="/funcionarios" class="btn red">
            Cancelar
        </a>

        <a href="/apagar-funcionario/{{ f[0] }}"
           class="btn red"
           onclick="return confirm('Deseja desativar este cadastro? O histórico será mantido.')">
            🗑️ Desativar
        </a>
    </div>

</form>

</div>

<script>
function controlarSalario() {
    const tipo = document.getElementById("tipo").value;
    const campoSalario = document.getElementById("campo_salario");

    if (tipo === "Estagiário") {
        campoSalario.style.display = "none";
    } else {
        campoSalario.style.display = "block";
    }
}

controlarSalario();
</script>

{% endblock %}
