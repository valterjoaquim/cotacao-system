{% extends "base.html" %}
{% block content %}

<style>
    .page-title { margin-bottom: 5px; color: #0d47a1; }
    .subtitle { color: #666; margin-bottom: 25px; }
    .section-title {
        margin-top: 0;
        color: #0d47a1;
        border-left: 5px solid #d32f2f;
        padding-left: 10px;
    }
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }
    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
        color: #333;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }
    .table-cotacao {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background: white;
    }
    .table-cotacao th {
        background: #0d47a1;
        color: white;
        padding: 12px;
        text-align: left;
    }
    .table-cotacao td {
        padding: 10px;
        border-bottom: 1px solid #eee;
    }
    .table-cotacao input,
    .table-cotacao select {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }
    .actions {
        margin-top: 25px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .btn-secondary { background: #0d47a1; }

    @media (max-width: 800px) {
        .form-grid { grid-template-columns: 1fr; }
        .table-cotacao { font-size: 13px; }
    }
</style>

<h1 class="page-title">🧾 Nova Cotação</h1>
<p class="subtitle">Preencha os dados da empresa, os termos e os materiais ou serviços da cotação.</p>

<div class="card">

<form method="POST">

    <h3 class="section-title">🏢 Dados da Empresa Cliente</h3>

    <div class="form-grid">
        <div class="form-group">
            <label>Nome da Empresa</label>
            <input type="text" name="cliente" required placeholder="Ex: Empresa ABC Lda">
        </div>

        <div class="form-group">
            <label>Endereço</label>
            <input type="text" name="endereco" required placeholder="Ex: Beira, Moçambique">
        </div>

        <div class="form-group">
            <label>NUIT</label>
            <input type="text" name="nuit" required placeholder="Ex: 123456789">
        </div>

        <div class="form-group">
            <label>Nome do Serviço</label>
            <input type="text" name="servico" required placeholder="Ex: Instalação elétrica">
        </div>
    </div>

    <br><br>

    <h3 class="section-title">📋 Termos da Cotação</h3>

    <div class="form-grid">
        <div class="form-group">
            <label>Condição de Pagamento</label>
            <select name="pagamento" required>
                <option value="">-- Selecionar --</option>
                <option value="60/40">60% adjudicação + 40% entrega</option>
                <option value="100">100% no ato da adjudicação</option>
            </select>
        </div>

        <div class="form-group">
            <label>Prazo de Entrega</label>
            <input type="text" name="prazo" value="15 dias após aprovação da proposta" required>
        </div>

        <div class="form-group" style="grid-column: 1 / -1;">
            <label>NB (Opcional)</label>
            <textarea name="nb" placeholder="Ex: Observação importante para esta cotação..." style="min-height:90px; resize:vertical;"></textarea>
        </div>
    </div>

    <br><br>

    <h3 class="section-title">📦 Materiais / Serviços</h3>

    <table class="table-cotacao">
        <thead>
            <tr>
                <th style="width:90px;">Qtd</th>
                <th style="width:120px;">Unidade</th>
                <th>Descrição</th>
                <th style="width:160px;">Preço Unitário</th>
                <th style="width:90px;">Ação</th>
            </tr>
        </thead>

        <tbody id="itens">
            <tr>
                <td>
                    <input type="number" name="quantidade[]" step="0.01" style="width:80px;">
                </td>

                <td>
                    <select name="unidade[]" style="width:100%;">
                        <option>un</option>
                        <option>m</option>
                        <option>kg</option>
                        <option>L</option>
                        <option>m²</option>
                        <option>m³</option>
                        <option>cx</option>
                    </select>
                </td>

                <td>
                    <input type="text" name="descricao[]" style="width:100%;">
                </td>

                <td>
                    <input type="number" name="preco[]" step="0.01" style="width:130px;">
                </td>

                <td>
                    <button type="button" class="btn red" onclick="removerLinha(this)">
                        Remover
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="actions">
        <button type="button" onclick="adicionarLinha()" class="btn btn-secondary">
            ➕ Adicionar Item
        </button>

        <button type="submit" class="btn red">
            💾 Gerar Cotação
        </button>
    </div>

</form>

</div>

<script>
function adicionarLinha() {
    const tabela = document.getElementById("itens");
    const novaLinha = document.createElement("tr");

    novaLinha.innerHTML = `
        <td>
            <input type="number" name="quantidade[]" step="0.01" style="width:80px;">
        </td>

        <td>
            <select name="unidade[]" style="width:100%;">
                <option>un</option>
                <option>m</option>
                <option>kg</option>
                <option>L</option>
                <option>m²</option>
                <option>m³</option>
                <option>cx</option>
            </select>
        </td>

        <td>
            <input type="text" name="descricao[]" style="width:100%;">
        </td>

        <td>
            <input type="number" name="preco[]" step="0.01" style="width:130px;">
        </td>

        <td>
            <button type="button" class="btn red" onclick="removerLinha(this)">
                Remover
            </button>
        </td>
    `;

    tabela.appendChild(novaLinha);
}

function removerLinha(botao) {
    const tabela = document.getElementById("itens");

    if (tabela.rows.length > 1) {
        botao.closest("tr").remove();
    } else {
        alert("A cotação deve ter pelo menos uma linha de item.");
    }
}
</script>

{% endblock %}
